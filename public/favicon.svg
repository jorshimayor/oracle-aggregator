<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="arc" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="pesa" x1="16" y1="16" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="32" cy="32" r="32" fill="url(#bg)"/>

  <!-- Outer arc ring — broken circle suggesting a price chart arc -->
  <path d="M 10 32 A 22 22 0 1 1 54 32" stroke="url(#arc)" stroke-width="3.5" stroke-linecap="round" fill="none"/>

  <!-- Tick mark at arc end — like an oracle confirmation -->
  <circle cx="54" cy="32" r="2.5" fill="#6366f1"/>

  <!-- Stylised ₦ symbol (Naira, representing African FX) merged with P -->
  <!-- Vertical stem -->
  <line x1="25" y1="16" x2="25" y2="48" stroke="url(#pesa)" stroke-width="3" stroke-linecap="round"/>
  <!-- P bowl -->
  <path d="M 25 18 Q 44 18 44 26 Q 44 34 25 34" stroke="url(#pesa)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Naira crossbars -->
  <line x1="21" y1="28" x2="38" y2="28" stroke="url(#arc)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="21" y1="33" x2="38" y2="33" stroke="url(#arc)" stroke-width="2.5" stroke-linecap="round"/>
</svg>
